<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creative Test Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback, useRef } = React;

    const AWARENESS_STAGES = ["Unaware","Problem Aware","Solution Aware","Product Aware","Most Aware"];
    const FORMATS = ["Video","Static","UGC","Carousel","Story/Reel","Long-form"];
    const STATUSES = ["Planned","In Briefing","Live","Paused","Winner","Killed"];
    const EMOJI_OPTIONS = ["🎯","🔥","🎁","🏠","🔪","🎨","⏳","💡","🚀","💎","🧠","❤️","🌿","⚡","🛒"];
    const COLOR_OPTIONS = ["#E8F4FD","#FEF3E8","#E8F8EF","#F3E8FE","#FEE8E8","#FFF8E1","#E8F5E9","#FCE4EC","#E3F2FD","#F3E5F5"];
    const STATUS_COLORS = { Planned:"bg-gray-100 text-gray-600","In Briefing":"bg-yellow-100 text-yellow-700",Live:"bg-blue-100 text-blue-700",Paused:"bg-orange-100 text-orange-700",Winner:"bg-green-100 text-green-700",Killed:"bg-red-100 text-red-600" };
    const AWARENESS_COLORS = { Unaware:"bg-purple-100 text-purple-700","Problem Aware":"bg-pink-100 text-pink-700","Solution Aware":"bg-blue-100 text-blue-700","Product Aware":"bg-teal-100 text-teal-700","Most Aware":"bg-green-100 text-green-700" };

    const METRIC_FIELDS = [
      {key:"adName",label:"Ad Name",required:true},
      {key:"spend",label:"Spend (£/$)"},
      {key:"impressions",label:"Impressions"},
      {key:"reach",label:"Reach"},
      {key:"clicks",label:"Clicks"},
      {key:"ctr",label:"CTR (%)"},
      {key:"cpc",label:"CPC (£/$)"},
      {key:"cpm",label:"CPM (£/$)"},
      {key:"purchases",label:"Purchases"},
      {key:"roas",label:"ROAS"},
      {key:"cpa",label:"CPA (£/$)"},
      {key:"thumbstopRate",label:"Thumbstop Rate (%)"},
      {key:"hookRate",label:"Hook Rate (%)"},
      {key:"videoView25",label:"Video Views 25%"},
      {key:"videoView50",label:"Video Views 50%"},
      {key:"videoView75",label:"Video Views 75%"},
      {key:"videoView95",label:"Video Views 95%"},
      {key:"videoView100",label:"Video Views 100%"},
      {key:"avgPlayTime",label:"Avg Play Time (s)"},
      {key:"outboundCTR",label:"Outbound CTR (%)"},
      {key:"addToCart",label:"Add to Cart"},
      {key:"initCheckout",label:"Initiate Checkout"},
      {key:"frequency",label:"Frequency"},
    ];

    const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
    const TABS = ["Test Tracker","Brief Builder","Creative Analysis","Angle Library","Persona Library","Awareness Guide"];

    const AWARENESS_GUIDE = [
      { stage:"Unaware", color:"bg-purple-100 text-purple-700", border:"border-purple-200", icon:"😴", definition:"The audience has no idea they have a problem or that your product exists.", goal:"Interrupt and educate. Make them feel seen by naming a pain they haven't articulated yet.", examples:["'Most people don't realise their cheap knives are costing them 20 mins every meal prep...'","Pattern-interrupt hooks, bold statements, relatable frustrations"], metrics:"Thumbstop rate, 3-sec video views, scroll-stop", tipColor:"text-purple-600" },
      { stage:"Problem Aware", color:"bg-pink-100 text-pink-700", border:"border-pink-200", icon:"🤔", definition:"They know they have a problem but don't know there's a solution — or haven't found the right one.", goal:"Validate the pain deeply. Show you understand their frustration better than they do.", examples:["'Tired of knives that go blunt after a month?'","Agitate the problem, speak to the emotion, don't sell yet"], metrics:"Hook rate, video retention, comments", tipColor:"text-pink-600" },
      { stage:"Solution Aware", color:"bg-blue-100 text-blue-700", border:"border-blue-200", icon:"💡", definition:"They know solutions exist but haven't decided on a category or approach yet.", goal:"Educate on why your solution type is best. Position against alternatives.", examples:["'Why artisan-crafted knives outlast mass-produced ones by 10x'","Comparison content, educational, 'why X vs Y' angles"], metrics:"CTR, watch time, outbound clicks", tipColor:"text-blue-600" },
      { stage:"Product Aware", color:"bg-teal-100 text-teal-700", border:"border-teal-200", icon:"🔍", definition:"They know your product exists but haven't committed. They're comparing, hesitating, or need a nudge.", goal:"Overcome objections, build trust, reduce risk. Give them a reason to choose you now.", examples:["Social proof, reviews, guarantees, limited time offers","'Free sharpening for life. 100-day trial. No risk.'"], metrics:"CTR, add to cart, CPA", tipColor:"text-teal-600" },
      { stage:"Most Aware", color:"bg-green-100 text-green-700", border:"border-green-200", icon:"✅", definition:"They know your brand well and are close to buying — or have bought before. They just need the right trigger.", goal:"Convert with urgency, reward loyalty, or upsell. Keep it direct and offer-led.", examples:["Retargeting ads, abandoned cart, loyalty offers, seasonal promos","'Welcome back — your knife is waiting'"], metrics:"ROAS, CPA, conversion rate, repeat purchase", tipColor:"text-green-600" },
    ];
    const STORAGE_KEY = "ctt_data_v2";

    const loadStorage = () => { try { return JSON.parse(window.localStorage.getItem(STORAGE_KEY))||{}; } catch { return {}; } };
    const saveStorage = data => { try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {} };

    async function callClaude(prompt, apiKey, imageBase64=null, imageMime=null) {
      const content = imageBase64
        ? [{type:"image",source:{type:"base64",media_type:imageMime,data:imageBase64}},{type:"text",text:prompt}]
        : prompt;
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:3000,messages:[{role:"user",content}]})
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      return data.content?.map(b=>b.text||"").join("")||"";
    }

    async function extractPersonasAndAngles(researchText, brandName, apiKey) {
      const prompt = `You are a senior DTC marketing strategist. Analyse the following brand research and extract structured persona and angle data.\n\nBrand: ${brandName}\nResearch:\n${researchText.slice(0,8000)}\n\nReturn ONLY a JSON object (no markdown, no backticks):\n{"personas":[{"name":"Persona name","emoji":"single emoji","description":"1-2 sentence description"}],"angles":[{"personaName":"must match a persona name exactly","name":"Angle name","hook":"emotional hook"}]}\n\nExtract 3-6 personas and 2-4 angles per persona.`;
      const text = await callClaude(prompt, apiKey);
      return JSON.parse(text.replace(/```json|```/g,"").trim());
    }

    async function generateBrief({persona,angle,format,awareness,notes,brandContext,apiKey}) {
      const prompt = `You are a senior DTC creative strategist. Generate a creative brief for a paid social ad.\n\nBrand: ${brandContext}\nPersona: ${persona.name} — ${persona.description||""}\nAngle: ${angle.name}\nHook: ${angle.hook}\nFormat: ${format}\nAwareness: ${awareness}\nNotes: ${notes||"None"}\n\nReturn ONLY a JSON object (no markdown, no backticks):\n{"hooks":["hook 1","hook 2","hook 3"],"shortCopy":"2-3 sentence ad body","longCopy":"5-7 sentence ad body","creativeDirection":"2-3 sentences on visual style","visualConcepts":["concept 1","concept 2","concept 3"],"awarenessRationale":"1-2 sentences on why this stage fits","ctas":["CTA 1","CTA 2","CTA 3"]}`;
      const text = await callClaude(prompt, apiKey);
      return JSON.parse(text.replace(/```json|```/g,"").trim());
    }

    async function analyseCreative({metrics, brandContext, imageBase64, imageMime, apiKey}) {
      const metricsSummary = Object.entries(metrics).filter(([k,v])=>v&&k!=="adName").map(([k,v])=>{
        const field = METRIC_FIELDS.find(f=>f.key===k);
        return `${field?.label||k}: ${v}`;
      }).join("\n");

      const prompt = `You are a senior DTC paid social strategist. Analyse this ad creative and its performance data.

Brand Context: ${brandContext||"Not provided"}
Ad Name: ${metrics.adName||"Unknown"}

PERFORMANCE METRICS:
${metricsSummary||"No metrics provided"}

${imageBase64?"An image of the creative has been provided for visual analysis.":"No creative image provided — analyse based on metrics only."}

Return ONLY a JSON object (no markdown, no backticks):
{
  "overallScore": "number 1-10",
  "summary": "2-3 sentence executive summary of this ad's performance",
  "strengths": [{"title":"strength title","detail":"1-2 sentence explanation"}],
  "weaknesses": [{"title":"weakness title","detail":"1-2 sentence explanation"}],
  "iterations": [{"title":"iteration idea","detail":"specific change to test and why","priority":"High/Medium/Low"}],
  "newAngles": [{"title":"new angle","hook":"emotional hook","rationale":"why based on the data"}],
  "creativeNotes": "if image provided, 2-3 sentences on visual strengths/weaknesses. If not, leave empty."
}

Provide 3-5 strengths, 3-5 weaknesses, 4-6 iterations, 2-3 new angles.`;

      const text = await callClaude(prompt, apiKey, imageBase64, imageMime);
      return JSON.parse(text.replace(/```json|```/g,"").trim());
    }

    // ── UI helpers ───────────────────────────────────────────────────────────
    const Pill = ({label,colorClass}) => <span className={`text-xs font-medium px-2 py-0.5 rounded-full ${colorClass}`}>{label}</span>;
    const Field = ({label,children}) => <div className="space-y-1"><label className="text-xs font-semibold text-gray-500 uppercase tracking-wide">{label}</label>{children}</div>;
    const Input = ({value,onChange,placeholder,className="",type="text"}) => <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className={`w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 ${className}`}/>;
    const SelectEl = ({value,onChange,options,className=""}) => <select value={value} onChange={e=>onChange(e.target.value)} className={`border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300 ${className}`}>{options.map(o=><option key={o} value={o}>{o}</option>)}</select>;
    const Spinner = () => <div className="w-6 h-6 border-2 border-indigo-300 border-t-indigo-600 rounded-full animate-spin mx-auto"/>;

    const Modal = ({show,onClose,title,children,wide}) => {
      if (!show) return null;
      return <div className="fixed inset-0 bg-black bg-opacity-40 flex items-start justify-center z-50 p-4 overflow-y-auto">
        <div className={`bg-white rounded-2xl shadow-2xl w-full my-6 ${wide?"max-w-3xl":"max-w-lg"}`}>
          <div className="flex items-center justify-between p-5 border-b border-gray-100">
            <h3 className="font-semibold text-gray-800 text-lg">{title}</h3>
            <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl leading-none">×</button>
          </div>
          <div className="p-5 space-y-4 max-h-[80vh] overflow-y-auto">{children}</div>
        </div>
      </div>;
    };

    const BriefDisplay = ({brief}) => {
      if (!brief) return null;
      const Section = ({title,children}) => <div className="space-y-2"><p className="text-xs font-bold uppercase tracking-widest text-indigo-500">{title}</p>{children}</div>;
      return <div className="space-y-5">
        <Section title="Hook Options">{brief.hooks?.map((h,i)=><div key={i} className="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm font-medium text-gray-800">"{h}"</div>)}</Section>
        <Section title="Short Copy"><div className="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 whitespace-pre-wrap">{brief.shortCopy}</div></Section>
        <Section title="Long Copy"><div className="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 whitespace-pre-wrap">{brief.longCopy}</div></Section>
        <Section title="Creative Direction"><div className="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700">{brief.creativeDirection}</div></Section>
        <Section title="Visual Concepts"><ul className="space-y-1">{brief.visualConcepts?.map((v,i)=><li key={i} className="flex gap-2 text-sm text-gray-700"><span className="text-indigo-400 font-bold">→</span>{v}</li>)}</ul></Section>
        <Section title="Awareness Rationale"><div className="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700">{brief.awarenessRationale}</div></Section>
        <Section title="CTAs"><div className="flex flex-wrap gap-2">{brief.ctas?.map((c,i)=><span key={i} className="bg-indigo-50 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-200">{c}</span>)}</div></Section>
      </div>;
    };

    // ── Creative Analysis Tab ────────────────────────────────────────────────
    function CreativeAnalysisTab({client, apiKey}) {
      const [inputMode, setInputMode] = useState("manual"); // manual | paste | csv
      const [metrics, setMetrics] = useState({adName:""});
      const [pasteText, setPasteText] = useState("");
      const [imageBase64, setImageBase64] = useState(null);
      const [imageMime, setImageMime] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");
      const [savedAnalyses, setSavedAnalyses] = useState(client?.analyses||[]);
      const [viewingAnalysis, setViewingAnalysis] = useState(null);
      const fileRef = useRef();
      const imgRef = useRef();

      const setMetric = (key,val) => setMetrics(m=>({...m,[key]:val}));

      const handleImageUpload = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const base64 = ev.target.result.split(",")[1];
          setImageBase64(base64);
          setImageMime(file.type);
          setImagePreview(ev.target.result);
        };
        reader.readAsDataURL(file);
      };

      const parseCSVOrPaste = text => {
        const lines = text.trim().split("\n").filter(Boolean);
        if (lines.length < 2) return null;
        const headers = lines[0].split(",").map(h=>h.trim().replace(/"/g,"").toLowerCase());
        const values = lines[1].split(",").map(v=>v.trim().replace(/"/g,""));
        const mapped = {};
        const headerMap = {
          "ad name":"adName","campaign name":"adName","name":"adName",
          "amount spent":"spend","spend":"spend",
          "impressions":"impressions","reach":"reach","clicks":"clicks",
          "ctr (all)":"ctr","ctr":"ctr","link click-through rate":"ctr",
          "cpc (all)":"cpc","cpc":"cpc",
          "cpm":"cpm","cost per 1,000 impressions":"cpm",
          "purchases":"purchases","results":"purchases",
          "purchase roas":"roas","roas":"roas","website purchase roas":"roas",
          "cost per purchase":"cpa","cpa":"cpa",
          "video plays at 25%":"videoView25","video plays at 50%":"videoView50",
          "video plays at 75%":"videoView75","video plays at 95%":"videoView95",
          "video plays at 100%":"videoView100","thruplays":"videoView100",
          "average play time":"avgPlayTime","avg. play time per video play":"avgPlayTime",
          "outbound ctr":"outboundCTR","outbound clicks ctr":"outboundCTR",
          "adds to cart":"addToCart","add to cart":"addToCart",
          "checkouts initiated":"initCheckout","initiate checkout":"initCheckout",
          "frequency":"frequency",
        };
        headers.forEach((h,i)=>{ const key=headerMap[h]; if(key&&values[i]) mapped[key]=values[i]; });
        return Object.keys(mapped).length > 0 ? mapped : null;
      };

      const handleAnalyse = async () => {
        if (!apiKey) { setError("Please enter your Anthropic API key in the header."); return; }
        let finalMetrics = {...metrics};
        if (inputMode==="paste"||inputMode==="csv") {
          const parsed = parseCSVOrPaste(pasteText);
          if (parsed) finalMetrics = {...finalMetrics,...parsed};
          else if (inputMode==="csv") { setError("Couldn't parse CSV. Make sure you paste with headers in the first row."); return; }
        }
        if (!finalMetrics.adName?.trim()) { setError("Please enter an ad name."); return; }
        setLoading(true); setError(""); setResult(null);
        try {
          const analysis = await analyseCreative({metrics:finalMetrics, brandContext:client?.brandContext||"", imageBase64, imageMime, apiKey});
          const saved = {id:uid(), adName:finalMetrics.adName, date:new Date().toLocaleDateString("en-GB"), metrics:finalMetrics, analysis, imagePreview};
          setSavedAnalyses(prev=>{
            const updated=[saved,...prev];
            return updated;
          });
          setResult({...saved});
        } catch(e) { setError("Analysis failed: "+e.message); }
        setLoading(false);
      };

      const scoreColor = s => {
        const n=parseInt(s);
        if(n>=8)return"text-green-600"; if(n>=6)return"text-yellow-600"; return"text-red-500";
      };

      const priorityColor = p => ({High:"bg-red-50 text-red-600 border-red-200",Medium:"bg-yellow-50 text-yellow-600 border-yellow-200",Low:"bg-gray-50 text-gray-500 border-gray-200"}[p]||"bg-gray-50 text-gray-500 border-gray-200");

      const AnalysisDisplay = ({data}) => {
        const {analysis, adName, date, metrics:m, imagePreview:ip} = data;
        return <div className="space-y-6">
          <div className="flex items-start justify-between gap-4">
            <div>
              <p className="font-bold text-gray-900 text-lg">{adName}</p>
              <p className="text-xs text-gray-400">{date}</p>
            </div>
            <div className="text-center">
              <p className={`text-4xl font-black ${scoreColor(analysis.overallScore)}`}>{analysis.overallScore}<span className="text-lg text-gray-400">/10</span></p>
              <p className="text-xs text-gray-400">Overall Score</p>
            </div>
          </div>

          {ip&&<img src={ip} alt="Creative" className="w-full max-h-48 object-contain rounded-xl border border-gray-200 bg-gray-50"/>}

          <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-4">
            <p className="text-xs font-bold text-indigo-500 uppercase tracking-widest mb-1">Summary</p>
            <p className="text-sm text-gray-700">{analysis.summary}</p>
          </div>

          {analysis.creativeNotes&&<div className="bg-purple-50 border border-purple-100 rounded-xl p-4">
            <p className="text-xs font-bold text-purple-500 uppercase tracking-widest mb-1">Visual Analysis</p>
            <p className="text-sm text-gray-700">{analysis.creativeNotes}</p>
          </div>}

          {Object.keys(m).filter(k=>k!=="adName"&&m[k]).length>0&&<div className="bg-gray-50 rounded-xl p-4">
            <p className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">Key Metrics</p>
            <div className="grid grid-cols-3 gap-2">
              {Object.entries(m).filter(([k,v])=>k!=="adName"&&v).map(([k,v])=>{
                const field=METRIC_FIELDS.find(f=>f.key===k);
                return <div key={k} className="bg-white rounded-lg p-2 border border-gray-200">
                  <p className="text-xs text-gray-400">{field?.label||k}</p>
                  <p className="text-sm font-bold text-gray-800">{v}</p>
                </div>;
              })}
            </div>
          </div>}

          <div className="grid grid-cols-2 gap-4">
            <div>
              <p className="text-xs font-bold text-green-600 uppercase tracking-widest mb-2">✓ Strengths</p>
              <div className="space-y-2">{analysis.strengths?.map((s,i)=><div key={i} className="bg-green-50 border border-green-100 rounded-xl p-3"><p className="text-xs font-bold text-green-700">{s.title}</p><p className="text-xs text-gray-600 mt-0.5">{s.detail}</p></div>)}</div>
            </div>
            <div>
              <p className="text-xs font-bold text-red-500 uppercase tracking-widest mb-2">✗ Weaknesses</p>
              <div className="space-y-2">{analysis.weaknesses?.map((w,i)=><div key={i} className="bg-red-50 border border-red-100 rounded-xl p-3"><p className="text-xs font-bold text-red-600">{w.title}</p><p className="text-xs text-gray-600 mt-0.5">{w.detail}</p></div>)}</div>
            </div>
          </div>

          <div>
            <p className="text-xs font-bold text-indigo-500 uppercase tracking-widest mb-2">→ Suggested Iterations</p>
            <div className="space-y-2">{analysis.iterations?.map((it,i)=><div key={i} className="bg-white border border-gray-200 rounded-xl p-3 flex items-start gap-3">
              <span className={`text-xs font-semibold px-2 py-0.5 rounded-full border flex-shrink-0 mt-0.5 ${priorityColor(it.priority)}`}>{it.priority}</span>
              <div><p className="text-xs font-bold text-gray-800">{it.title}</p><p className="text-xs text-gray-500 mt-0.5">{it.detail}</p></div>
            </div>)}</div>
          </div>

          <div>
            <p className="text-xs font-bold text-purple-500 uppercase tracking-widest mb-2">💡 New Angle Ideas</p>
            <div className="space-y-2">{analysis.newAngles?.map((a,i)=><div key={i} className="bg-purple-50 border border-purple-100 rounded-xl p-3"><p className="text-xs font-bold text-purple-700">{a.title}</p><p className="text-xs text-indigo-600 italic mt-0.5">"{a.hook}"</p><p className="text-xs text-gray-500 mt-1">{a.rationale}</p></div>)}</div>
          </div>
        </div>;
      };

      return <div className="space-y-4">
        {/* Saved analyses list */}
        {savedAnalyses.length>0&&!result&&<div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
          <div className="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
            <p className="text-sm font-semibold text-gray-800">Previous Analyses</p>
            <button onClick={()=>setResult(null)} className="text-xs text-indigo-500 hover:underline">+ New Analysis</button>
          </div>
          <div className="divide-y divide-gray-50">
            {savedAnalyses.map(a=><div key={a.id} className="px-4 py-3 flex items-center gap-3 hover:bg-gray-50 cursor-pointer" onClick={()=>setViewingAnalysis(a)}>
              <div className="flex-1"><p className="text-sm font-medium text-gray-800">{a.adName}</p><p className="text-xs text-gray-400">{a.date}</p></div>
              <span className={`text-lg font-black ${scoreColor(a.analysis.overallScore)}`}>{a.analysis.overallScore}/10</span>
              <span className="text-xs text-indigo-500 hover:underline">View →</span>
            </div>)}
          </div>
        </div>}

        {/* Input form */}
        {!result&&<div className="bg-white border border-gray-200 rounded-xl p-5 space-y-4">
          <p className="font-semibold text-gray-800">Analyse a Creative</p>

          {/* Input mode */}
          <div className="flex gap-2">
            {[["manual","✏️ Manual"],["paste","📋 Paste Data"],["csv","📊 CSV"]].map(([m,l])=><button key={m} onClick={()=>{setInputMode(m);setError("");}} className={`flex-1 py-2 rounded-lg text-sm font-medium border transition ${inputMode===m?"border-indigo-500 bg-indigo-50 text-indigo-700":"border-gray-200 text-gray-500 hover:bg-gray-50"}`}>{l}</button>)}
          </div>

          {/* Ad name always shown */}
          <Field label="Ad Name *"><Input value={metrics.adName||""} onChange={v=>setMetric("adName",v)} placeholder="e.g. Katto — Unboxing UGC v3"/></Field>

          {/* Manual entry */}
          {inputMode==="manual"&&<div className="grid grid-cols-2 gap-3">
            {METRIC_FIELDS.filter(f=>f.key!=="adName").map(f=><Field key={f.key} label={f.label}>
              <Input value={metrics[f.key]||""} onChange={v=>setMetric(f.key,v)} placeholder="—"/>
            </Field>)}
          </div>}

          {/* Paste / CSV */}
          {(inputMode==="paste"||inputMode==="csv")&&<div className="space-y-2">
            <Field label={inputMode==="csv"?"Paste CSV (with header row)":"Paste data (comma-separated or Meta export)"}>

    // ── Auth ─────────────────────────────────────────────────────────────────
    function AuthScreen({onLogin}) {
      const [mode, setMode] = useState("login");
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");

      const handleLogin = () => {
        setError("");
        const storage = loadStorage();
        const users = storage.users||{};
        const user = users[email.toLowerCase()];
        if (!user) { setError("No account found with that email."); return; }
        if (user.password!==password) { setError("Incorrect password."); return; }
        onLogin({email:email.toLowerCase(), name:user.name});
      };

      const handleRegister = () => {
        setError("");
        const storage = loadStorage();
        const users = storage.users||{};
        if (!name.trim()) { setError("Please enter your name."); return; }
        if (!email.includes("@")) { setError("Please enter a valid email."); return; }
        if (password.length<6) { setError("Password must be at least 6 characters."); return; }
        if (users[email.toLowerCase()]) { setError("An account with this email already exists."); return; }
        const updated = {...storage, users:{...users,[email.toLowerCase()]:{name:name.trim(),password,clients:[],apiKey:""}}};
        saveStorage(updated);
        onLogin({email:email.toLowerCase(), name:name.trim()});
      };

      return <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-white flex items-center justify-center p-4">
        <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 space-y-6">

            <h1 className="text-2xl font-bold text-gray-900">Creative Test Tracker</h1>
            <p className="text-sm text-gray-500">Agency framework for personas, angles &amp; AI briefs</p>
          </div>
          <div className="flex gap-1 bg-gray-100 rounded-xl p-1">
            {["login","register"].map(m=><button key={m} onClick={()=>{setMode(m);setError("");}} className={`flex-1 py-2 rounded-lg text-sm font-medium transition ${mode===m?"bg-white text-gray-900 shadow-sm":"text-gray-500 hover:text-gray-700"}`}>{m==="login"?"Sign In":"Create Account"}</button>)}
          </div>

            {mode==="register"&&<Field label="Your Name"><Input value={name} onChange={setName} placeholder="e.g. Tommy"/></Field>}
            <Field label="Email"><Input value={email} onChange={setEmail} placeholder="you@agency.com" type="email"/></Field>
            <Field label="Password"><Input value={password} onChange={setPassword} placeholder="••••••••" type="password"/></Field>

              </div>

                <Input value={newP.name} onChange={v=>setNewP(p=>({...p,name:v}))} placeholder="Persona name"/>
                <Input value={newP.description} onChange={v=>setNewP(p=>({...p,description:v}))} placeholder="Short description"/>
                <div className="flex gap-2">
                  <div className="flex-1"><p className="text-xs text-gray-400 mb-1">Emoji</p><div className="flex flex-wrap gap-1">{EMOJI_OPTIONS.map(e=><button key={e} onClick={()=>setNewP(p=>({...p,emoji:e}))} className={`text-lg p-1 rounded ${newP.emoji===e?"bg-indigo-100":"hover:bg-gray-100"}`}>{e}</button>)}</div></div>

    // ── Main App ─────────────────────────────────────────────────────────────
    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [apiKey, setApiKey] = useState("");
      const [showApiKey, setShowApiKey] = useState(false);
      const [clients, setClients] = useState([]);
      const [activeClientId, setActiveClientId] = useState(null);
      const [showOnboarding, setShowOnboarding] = useState(false);
      const [activeTab, setActiveTab] = useState("Test Tracker");
      const [filters, setFilters] = useState({persona:"All",awareness:"All",format:"All",status:"All"});
      const [showTestModal, setShowTestModal] = useState(false);
      const [showAngleModal, setShowAngleModal] = useState(false);
      const [showPersonaModal, setShowPersonaModal] = useState(false);
      const [showBriefModal, setShowBriefModal] = useState(false);
      const [briefModalTest, setBriefModalTest] = useState(null);
      const [editingTest, setEditingTest] = useState(null);
      const [editingAngle, setEditingAngle] = useState(null);
      const [editingPersona, setEditingPersona] = useState(null);
      const [generatingId, setGeneratingId] = useState(null);
      const [bbPersonaId, setBbPersonaId] = useState(null);
      const [bbAngleId, setBbAngleId] = useState(null);
      const [bbFormat, setBbFormat] = useState("Video");
      const [bbAwareness, setBbAwareness] = useState("Problem Aware");
      const [bbNotes, setBbNotes] = useState("");
      const [bbBrief, setBbBrief] = useState(null);
      const [bbLoading, setBbLoading] = useState(false);

      useEffect(() => {
        const storage = loadStorage();
        if (storage.session) {
          const user = storage.users?.[storage.session];
          if (user) {
            setCurrentUser({email:storage.session,name:user.name});
            setClients(user.clients||[]);
            setApiKey(user.apiKey||"");
            if ((user.clients||[]).length>0) setActiveClientId(user.clients[0].id);
          }
        }
      }, []);

      const persistUserData = useCallback((updatedClients, updatedApiKey) => {
        if (!currentUser) return;
        const storage = loadStorage();
        const users = storage.users||{};
        users[currentUser.email] = {...users[currentUser.email],clients:updatedClients,apiKey:updatedApiKey};
        saveStorage({...storage,users});
      }, [currentUser]);

      useEffect(() => { if (currentUser) persistUserData(clients, apiKey); }, [clients, apiKey]);

      const handleLogin = user => {
        const storage = loadStorage();
        const userData = storage.users?.[user.email]||{};
        setCurrentUser(user);
        setClients(userData.clients||[]);
        setApiKey(userData.apiKey||"");
        if ((userData.clients||[]).length>0) setActiveClientId(userData.clients[0].id);
        saveStorage({...storage,session:user.email});
      };

      const handleLogout = () => {
        const storage = loadStorage();
        delete storage.session;
        saveStorage(storage);
        setCurrentUser(null); setClients([]); setApiKey(""); setActiveClientId(null); setShowOnboarding(false);
      };

      const client = clients.find(c=>c.id===activeClientId)||null;
      const personas = client?.personas||[];
      const angles = client?.angles||[];
      const tests = client?.tests||[];
      const updateClient = patch => setClients(cs=>cs.map(c=>c.id===activeClientId?{...c,...patch}:c));
      const updatePersonas = fn => updateClient({personas:fn(personas)});
      const updateAngles = fn => updateClient({angles:fn(angles)});
      const updateTests = fn => updateClient({tests:fn(tests)});
      const getPersona = id => personas.find(p=>p.id===id);
      const getAngle = id => angles.find(a=>a.id===id);

      const handleOnboardingComplete = ({brandName,brandContext,personas:ps,angles:as}) => {
        const c={id:uid(),brandName,brandContext,personas:ps,angles:as,tests:[],analyses:[]};
        setClients(cs=>[...cs,c]); setActiveClientId(c.id); setShowOnboarding(false); setActiveTab("Test Tracker");
        if (ps.length>0){setBbPersonaId(ps[0].id);setBbAngleId(as.find(a=>a.personaId===ps[0].id)?.id||null);}
      };

      const filteredTests = useMemo(()=>tests.filter(t=>{
        const angle=getAngle(t.angleId); const persona=angle?getPersona(angle.personaId):null;
        if(filters.persona!=="All"&&(!persona||persona.name!==filters.persona))return false;
        if(filters.awareness!=="All"&&t.awareness!==filters.awareness)return false;
        if(filters.format!=="All"&&t.format!==filters.format)return false;
        if(filters.status!=="All"&&t.status!==filters.status)return false;
        return true;
      }),[tests,filters,angles,personas]);

      const handleGenerateBrief = async test => {
        if(!apiKey){alert("Please enter your Anthropic API key.");return;}
        const angle=getAngle(test.angleId); const persona=getPersona(angle?.personaId);
        if(!angle||!persona)return;
        setGeneratingId(test.id);
        try {
          const brief=await generateBrief({persona,angle,format:test.format,awareness:test.awareness,notes:test.notes,brandContext:client?.brandContext||"",apiKey});
          const updated={...test,brief};
          updateTests(ts=>ts.map(t=>t.id===test.id?updated:t));
          setBriefModalTest(updated); setShowBriefModal(true);
        } catch(e){alert("Brief generation failed: "+e.message);}
        setGeneratingId(null);
      };

      const handleBBGenerate = async () => {
        if(!apiKey){alert("Please enter your Anthropic API key.");return;}
        const angle=getAngle(bbAngleId); const persona=getPersona(bbPersonaId);
        if(!angle||!persona)return;
        setBbLoading(true); setBbBrief(null);
        try { const brief=await generateBrief({persona,angle,format:bbFormat,awareness:bbAwareness,notes:bbNotes,brandContext:client?.brandContext||"",apiKey}); setBbBrief(brief); }
        catch(e){alert("Failed: "+e.message);}
        setBbLoading(false);
      };

      const cycleStatus = id => updateTests(ts=>ts.map(t=>t.id!==id?t:{...t,status:STATUSES[(STATUSES.indexOf(t.status)+1)%STATUSES.length]}));

      const exportCSV = () => {
        const rows=[["Test Name","Angle","Persona","Format","Awareness","Status","Notes"]];
        tests.forEach(t=>{const a=getAngle(t.angleId);const p=a?getPersona(a.personaId):null;rows.push([t.name,a?.name||"",p?.name||"",t.format,t.awareness,t.status,t.notes]);});
        const csv=rows.map(r=>r.map(c=>`"${(c||"").replace(/"/g,'""')}"`).join(",")).join("\n");
        const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`${client?.brandName||"tracker"}-tests.csv`;a.click();
      };

      const bbAngles = angles.filter(a=>a.personaId===bbPersonaId);

      if (!currentUser) return <AuthScreen onLogin={handleLogin}/>;
      if (showOnboarding) return <OnboardingWizard onComplete={handleOnboardingComplete} onCancel={()=>setShowOnboarding(false)} apiKey={apiKey}/>;

      if (clients.length===0) return <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-white flex items-center justify-center p-4">
        <div className="text-center space-y-6 max-w-md">
          <div className="w-20 h-20 bg-indigo-600 rounded-2xl flex items-center justify-center text-4xl mx-auto shadow-lg">🎯</div>
          <div><h1 className="text-3xl font-bold text-gray-900">Welcome, {currentUser.name}!</h1><p className="text-gray-500 mt-2">Let's set up your first client.</p></div>
          <div className="bg-white rounded-xl border border-gray-200 p-4 text-left space-y-2">
            <p className="text-xs font-bold text-indigo-500 uppercase tracking-wide">Anthropic API Key <span className="text-gray-400 font-normal normal-case">(optional — needed for AI features)</span></p>
            <div className="flex gap-2">
              <input type={showApiKey?"text":"password"} value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk-ant-..." className="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
              <button onClick={()=>setShowApiKey(s=>!s)} className="text-xs text-gray-400 hover:text-gray-600 px-2">{showApiKey?"Hide":"Show"}</button>
            </div>
          </div>
          <button onClick={()=>setShowOnboarding(true)} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 text-lg">+ Add Your First Client</button>
          <button onClick={handleLogout} className="text-sm text-gray-400 hover:underline">Sign out</button>
        </div>
      </div>;

      return <div className="min-h-screen bg-gray-50">
        <div className="bg-white border-b border-gray-200 px-4 py-3">
          <div className="max-w-7xl mx-auto flex items-center gap-3 flex-wrap">
            <span className="text-lg font-bold text-gray-900 flex-shrink-0">🎯 Creative Tracker</span>
            <div className="flex items-center gap-2 flex-wrap flex-1">
              {clients.map(c=><button key={c.id} onClick={()=>{setActiveClientId(c.id);setFilters({persona:"All",awareness:"All",format:"All",status:"All"});setBbBrief(null);}} className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${c.id===activeClientId?"bg-indigo-600 text-white":"bg-gray-100 text-gray-600 hover:bg-gray-200"}`}>{c.brandName}</button>)}
              <button onClick={()=>setShowOnboarding(true)} className="px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-100 text-indigo-600 hover:bg-indigo-50">+ Client</button>
            </div>
            <div className="flex items-center gap-2">
              <input type={showApiKey?"text":"password"} value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="API Key" className="border border-gray-200 rounded-lg px-3 py-1.5 text-xs w-40 focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
              <button onClick={()=>setShowApiKey(s=>!s)} className="text-xs text-gray-400">{showApiKey?"Hide":"Show"}</button>
              {apiKey&&<span className="text-xs text-green-600 font-semibold">✓</span>}
              <button onClick={exportCSV} className="border border-gray-200 px-3 py-1.5 rounded-lg text-xs text-gray-600 hover:bg-gray-50">↓ CSV</button>
              <div className="border-l border-gray-200 pl-2 flex items-center gap-2">
                <span className="text-xs text-gray-500">{currentUser.name}</span>
                <button onClick={handleLogout} className="text-xs text-gray-400 hover:text-red-500">Sign out</button>
              </div>
            </div>
          </div>
        </div>

        <div className="max-w-7xl mx-auto px-4 py-3 grid grid-cols-4 gap-3">
          {[["Tests",tests.length,"text-gray-700"],["Live",tests.filter(t=>t.status==="Live").length,"text-blue-600"],["Winners",tests.filter(t=>t.status==="Winner").length,"text-green-600"],["Briefs",tests.filter(t=>t.brief).length,"text-indigo-600"]].map(([l,v,c])=><div key={l} className="bg-white rounded-xl border border-gray-200 p-3"><p className="text-xs text-gray-400 uppercase tracking-wide">{l}</p><p className={`text-2xl font-bold mt-0.5 ${c}`}>{v}</p></div>)}
        </div>

        {client&&<div className="max-w-7xl mx-auto px-4 pb-2"><div className="bg-white border border-gray-200 rounded-xl px-4 py-2 flex items-start gap-3"><span className="text-xs font-bold uppercase tracking-widest text-indigo-500 mt-1 flex-shrink-0">Brand</span><textarea value={client.brandContext} onChange={e=>updateClient({brandContext:e.target.value})} rows={2} className="flex-1 text-sm text-gray-700 focus:outline-none resize-none bg-transparent" placeholder="Brand context for AI brief generation..."/></div></div>}

        <div className="max-w-7xl mx-auto px-4 pt-1">
          <div className="flex gap-1 bg-gray-100 rounded-xl p-1 w-fit overflow-x-auto">
            {TABS.map(tab=><button key={tab} onClick={()=>setActiveTab(tab)} className={`px-4 py-2 rounded-lg text-sm font-medium transition whitespace-nowrap ${activeTab===tab?"bg-white text-gray-900 shadow-sm":"text-gray-500 hover:text-gray-700"}`}>{tab}</button>)}
          </div>
        </div>

        <div className="max-w-7xl mx-auto px-4 py-4">
          {activeTab==="Test Tracker"&&<div className="space-y-3">
            <div className="bg-white border border-gray-200 rounded-xl p-3 flex flex-wrap gap-2 items-center">
              <span className="text-sm text-gray-500">Filter:</span>
              <SelectEl value={filters.persona} onChange={v=>setFilters(f=>({...f,persona:v}))} options={["All",...personas.map(p=>p.name)]}/>
              <SelectEl value={filters.awareness} onChange={v=>setFilters(f=>({...f,awareness:v}))} options={["All",...AWARENESS_STAGES]}/>
              <SelectEl value={filters.format} onChange={v=>setFilters(f=>({...f,format:v}))} options={["All",...FORMATS]}/>
              <SelectEl value={filters.status} onChange={v=>setFilters(f=>({...f,status:v}))} options={["All",...STATUSES]}/>
              <button onClick={()=>setFilters({persona:"All",awareness:"All",format:"All",status:"All"})} className="text-xs text-indigo-500 hover:underline">Clear</button>
              <button onClick={()=>{setEditingTest({id:null,angleId:angles[0]?.id||null,name:"",format:"Video",awareness:"Problem Aware",status:"Planned",notes:"",brief:null});setShowTestModal(true);}} className="ml-auto bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-700">+ Add Test</button>
            </div>
            {filteredTests.length===0&&<div className="text-center py-12 text-gray-400 bg-white rounded-xl border border-gray-200">No tests match these filters.</div>}
            {filteredTests.map(test=>{const angle=getAngle(test.angleId);const persona=angle?getPersona(angle.personaId):null;const isGen=generatingId===test.id;return<div key={test.id} className="bg-white border border-gray-200 rounded-xl p-4 flex items-start gap-3 hover:border-indigo-200 transition">
              {persona&&<div className="w-10 h-10 rounded-xl flex items-center justify-center text-xl flex-shrink-0" style={{background:persona.color}}>{persona.emoji}</div>}
              <div className="flex-1 min-w-0">
                <div className="flex items-start justify-between gap-2">
                  <div><p className="font-semibold text-gray-900 text-sm">{test.name}</p>{angle&&<p className="text-xs text-gray-400">Angle: {angle.name}</p>}{persona&&<p className="text-xs text-gray-400">Persona: {persona.name}</p>}</div>
                  <button onClick={()=>cycleStatus(test.id)} className={`text-xs font-medium px-2 py-1 rounded-full cursor-pointer flex-shrink-0 ${STATUS_COLORS[test.status]}`}>{test.status}</button>
                </div>
                <div className="flex flex-wrap gap-1.5 mt-2">
                  <Pill label={test.format} colorClass="bg-gray-100 text-gray-600"/>
                  <Pill label={test.awareness} colorClass={AWARENESS_COLORS[test.awareness]||"bg-gray-100 text-gray-600"}/>
                  {test.brief&&<Pill label="✓ Brief" colorClass="bg-indigo-50 text-indigo-600"/>}
                </div>
                {test.notes&&<p className="text-xs text-gray-400 mt-1.5 italic">{test.notes}</p>}
              </div>
              <div className="flex flex-col gap-1 items-end flex-shrink-0">
                {test.brief?<button onClick={()=>{setBriefModalTest(test);setShowBriefModal(true);}} className="text-xs text-indigo-600 font-semibold hover:underline">View Brief</button>:<button onClick={()=>handleGenerateBrief(test)} disabled={isGen} className={`text-xs px-2 py-1 rounded-lg font-semibold ${isGen?"bg-gray-100 text-gray-400":"bg-indigo-600 text-white hover:bg-indigo-700"}`}>{isGen?"Generating...":"✦ Brief"}</button>}
                <button onClick={()=>{setEditingTest({...test});setShowTestModal(true);}} className="text-xs text-gray-400 hover:text-indigo-500">Edit</button>
                <button onClick={()=>updateTests(ts=>ts.filter(t=>t.id!==test.id))} className="text-xs text-red-400 hover:underline">Delete</button>
              </div>
            </div>;})}
          </div>}

          {activeTab==="Brief Builder"&&<div className="grid gap-4" style={{gridTemplateColumns:bbBrief?"1fr 1.4fr":"1fr"}}>
            <div className="bg-white border border-gray-200 rounded-xl p-5 space-y-4 self-start">
              <p className="font-semibold text-gray-800">Build a Brief</p>
              <Field label="Persona"><select value={bbPersonaId||""} onChange={e=>{setBbPersonaId(e.target.value);setBbAngleId(angles.find(a=>a.personaId===e.target.value)?.id||null);setBbBrief(null);}} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"><option value="">Select persona...</option>{personas.map(p=><option key={p.id} value={p.id}>{p.emoji} {p.name}</option>)}</select></Field>
              <Field label="Angle"><select value={bbAngleId||""} onChange={e=>{setBbAngleId(e.target.value);setBbBrief(null);}} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"><option value="">Select angle...</option>{bbAngles.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select>{bbAngleId&&<p className="text-xs text-gray-400 mt-1 italic">{getAngle(bbAngleId)?.hook}</p>}</Field>
              <Field label="Format"><SelectEl value={bbFormat} onChange={v=>{setBbFormat(v);setBbBrief(null);}} options={FORMATS} className="w-full"/></Field>
              <Field label="Awareness"><SelectEl value={bbAwareness} onChange={v=>{setBbAwareness(v);setBbBrief(null);}} options={AWARENESS_STAGES} className="w-full"/></Field>
              <Field label="Extra Notes"><textarea value={bbNotes} onChange={e=>setBbNotes(e.target.value)} rows={3} placeholder="Seasonal context, offer details..." className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"/></Field>
              <button onClick={handleBBGenerate} disabled={bbLoading||!bbAngleId||!bbPersonaId} className={`w-full py-2.5 rounded-xl text-sm font-semibold transition ${bbLoading||!bbAngleId||!bbPersonaId?"bg-gray-100 text-gray-400 cursor-not-allowed":"bg-indigo-600 text-white hover:bg-indigo-700"}`}>{bbLoading?"✦ Generating...":"✦ Generate Brief"}</button>
              {bbBrief&&<button onClick={()=>{const t={id:uid(),angleId:bbAngleId,name:`${getAngle(bbAngleId)?.name} — ${bbFormat}`,format:bbFormat,awareness:bbAwareness,status:"In Briefing",notes:bbNotes,brief:bbBrief};updateTests(ts=>[...ts,t]);alert("Saved to Test Tracker.");}} className="w-full py-2 rounded-xl text-sm font-semibold border border-indigo-300 text-indigo-600 hover:bg-indigo-50">+ Save as Test</button>}
            </div>
            {bbLoading&&<div className="bg-white border border-gray-200 rounded-xl p-5 flex items-center justify-center" style={{minHeight:300}}><div className="text-center space-y-3"><Spinner/><p className="text-sm text-gray-400">Building your brief...</p></div></div>}
            {bbBrief&&!bbLoading&&<div className="bg-white border border-gray-200 rounded-xl p-5 space-y-5"><div className="flex items-center justify-between"><p className="font-semibold text-gray-800">Generated Brief</p><div className="flex gap-2"><Pill label={bbFormat} colorClass="bg-gray-100 text-gray-600"/><Pill label={bbAwareness} colorClass={AWARENESS_COLORS[bbAwareness]||"bg-gray-100 text-gray-600"}/></div></div><BriefDisplay brief={bbBrief}/></div>}
          </div>}

          {activeTab==="Creative Analysis"&&<CreativeAnalysisTab client={client} apiKey={apiKey}/>}

          {activeTab==="Angle Library"&&<div className="space-y-4">
            <div className="flex justify-end"><button onClick={()=>{setEditingAngle({id:null,personaId:personas[0]?.id||null,name:"",hook:""});setShowAngleModal(true);}} className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">+ Add Angle</button></div>
            {personas.map(persona=>{const pas=angles.filter(a=>a.personaId===persona.id);if(!pas.length)return null;return<div key={persona.id} className="bg-white border border-gray-200 rounded-xl overflow-hidden">
              <div className="px-4 py-3 flex items-center gap-3" style={{background:persona.color}}><span className="text-2xl">{persona.emoji}</span><span className="font-semibold text-gray-800 text-sm">{persona.name}</span><span className="text-xs text-gray-500 ml-auto">{pas.length} angles</span></div>
              <div className="divide-y divide-gray-50">{pas.map(angle=>{const tc=tests.filter(t=>t.angleId===angle.id).length;return<div key={angle.id} className="px-4 py-3 flex items-center gap-3"><div className="flex-1"><p className="text-sm font-medium text-gray-800">{angle.name}</p><p className="text-xs text-gray-400 mt-0.5">{angle.hook}</p></div><span className="text-xs text-gray-400">{tc} test{tc!==1?"s":""}</span><button onClick={()=>{setEditingAngle({...angle});setShowAngleModal(true);}} className="text-xs text-indigo-500 hover:underline">Edit</button><button onClick={()=>updateAngles(as=>as.filter(a=>a.id!==angle.id))} className="text-xs text-red-400 hover:underline">Delete</button></div>;})}</div>
            </div>;})}
          </div>}

          {activeTab==="Persona Library"&&<div className="space-y-4">
            <div className="flex justify-end"><button onClick={()=>{setEditingPersona({id:null,name:"",emoji:"🎯",color:"#E8F4FD",description:""});setShowPersonaModal(true);}} className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">+ Add Persona</button></div>
            {personas.map(persona=>{const ac=angles.filter(a=>a.personaId===persona.id).length;const tc=tests.filter(t=>angles.find(a=>a.id===t.angleId)?.personaId===persona.id).length;return<div key={persona.id} className="bg-white border border-gray-200 rounded-xl p-4 flex items-center gap-4">
              <div className="w-14 h-14 rounded-2xl flex items-center justify-center text-3xl flex-shrink-0" style={{background:persona.color}}>{persona.emoji}</div>
              <div className="flex-1"><p className="font-semibold text-gray-900">{persona.name}</p>{persona.description&&<p className="text-xs text-gray-400 mt-0.5">{persona.description}</p>}<div className="flex gap-4 mt-1"><span className="text-xs text-gray-400">{ac} angle{ac!==1?"s":""}</span><span className="text-xs text-gray-400">{tc} test{tc!==1?"s":""}</span></div></div>
              <button onClick={()=>{setEditingPersona({...persona});setShowPersonaModal(true);}} className="text-xs text-indigo-500 hover:underline">Edit</button>
              <button onClick={()=>{updatePersonas(ps=>ps.filter(p=>p.id!==persona.id));updateAngles(as=>as.filter(a=>a.personaId!==persona.id));}} className="text-xs text-red-400 hover:underline">Delete</button>
            </div>;})}
          </div>}
        </div>

        <Modal show={showBriefModal} onClose={()=>setShowBriefModal(false)} title={briefModalTest?.name||"Brief"} wide>
          {briefModalTest&&(()=>{const angle=getAngle(briefModalTest.angleId);const persona=angle?getPersona(angle.personaId):null;return<>
            <div className="flex flex-wrap gap-2 pb-2 border-b border-gray-100">
              {persona&&<Pill label={`${persona.emoji} ${persona.name}`} colorClass="bg-gray-100 text-gray-600"/>}
              {angle&&<Pill label={angle.name} colorClass="bg-indigo-50 text-indigo-600"/>}
              <Pill label={briefModalTest.format} colorClass="bg-gray-100 text-gray-600"/>
              <Pill label={briefModalTest.awareness} colorClass={AWARENESS_COLORS[briefModalTest.awareness]||"bg-gray-100 text-gray-600"}/>
            </div>
            <BriefDisplay brief={briefModalTest.brief}/>
            <button onClick={()=>{handleGenerateBrief(briefModalTest);setShowBriefModal(false);}} className="w-full py-2 rounded-xl text-sm border border-gray-200 text-gray-500 hover:bg-gray-50 mt-2">↺ Regenerate</button>
          </>;})()} 
        </Modal>

        <Modal show={showTestModal} onClose={()=>setShowTestModal(false)} title={editingTest?.id?"Edit Test":"Add Test"}>
          {editingTest&&<>
            <Field label="Test Name"><Input value={editingTest.name} onChange={v=>setEditingTest(p=>({...p,name:v}))} placeholder="e.g. Unboxing Cinematic v1"/></Field>
            <Field label="Angle"><select value={editingTest.angleId||""} onChange={e=>setEditingTest(p=>({...p,angleId:e.target.value}))} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">{angles.map(a=>{const p=getPersona(a.personaId);return<option key={a.id} value={a.id}>{p?.emoji} {a.name}</option>;})}</select></Field>
            <Field label="Format"><SelectEl value={editingTest.format} onChange={v=>setEditingTest(p=>({...p,format:v}))} options={FORMATS} className="w-full"/></Field>
            <Field label="Awareness"><SelectEl value={editingTest.awareness} onChange={v=>setEditingTest(p=>({...p,awareness:v}))} options={AWARENESS_STAGES} className="w-full"/></Field>
            <Field label="Status"><SelectEl value={editingTest.status} onChange={v=>setEditingTest(p=>({...p,status:v}))} options={STATUSES} className="w-full"/></Field>
            <Field label="Notes"><textarea value={editingTest.notes} onChange={e=>setEditingTest(p=>({...p,notes:e.target.value}))} rows={3} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"/></Field>
            <div className="flex gap-2 pt-1">
              <button onClick={()=>{if(!editingTest.name.trim())return;if(editingTest.id)updateTests(ts=>ts.map(t=>t.id===editingTest.id?editingTest:t));else updateTests(ts=>[...ts,{...editingTest,id:uid()}]);setShowTestModal(false);}} className="flex-1 bg-indigo-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Save</button>
              <button onClick={()=>setShowTestModal(false)} className="flex-1 border border-gray-200 py-2 rounded-lg text-sm text-gray-500 hover:bg-gray-50">Cancel</button>
            </div>
          </>}
        </Modal>

        <Modal show={showAngleModal} onClose={()=>setShowAngleModal(false)} title={editingAngle?.id?"Edit Angle":"Add Angle"}>
          {editingAngle&&<>
            <Field label="Angle Name"><Input value={editingAngle.name} onChange={v=>setEditingAngle(p=>({...p,name:v}))} placeholder="e.g. The Gift That Gets Passed Down"/></Field>
            <Field label="Persona"><select value={editingAngle.personaId||""} onChange={e=>setEditingAngle(p=>({...p,personaId:e.target.value}))} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">{personas.map(p=><option key={p.id} value={p.id}>{p.emoji} {p.name}</option>)}</select></Field>
            <Field label="Emotional Hook"><Input value={editingAngle.hook} onChange={v=>setEditingAngle(p=>({...p,hook:v}))} placeholder="e.g. Heirloom emotion + personalisation"/></Field>
            <div className="flex gap-2 pt-1">
              <button onClick={()=>{if(!editingAngle.name.trim())return;if(editingAngle.id)updateAngles(as=>as.map(a=>a.id===editingAngle.id?editingAngle:a));else updateAngles(as=>[...as,{...editingAngle,id:uid()}]);setShowAngleModal(false);}} className="flex-1 bg-indigo-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Save</button>
              <button onClick={()=>setShowAngleModal(false)} className="flex-1 border border-gray-200 py-2 rounded-lg text-sm text-gray-500 hover:bg-gray-50">Cancel</button>
            </div>
          </>}
        </Modal>

        <Modal show={showPersonaModal} onClose={()=>setShowPersonaModal(false)} title={editingPersona?.id?"Edit Persona":"Add Persona"}>
          {editingPersona&&<>
            <Field label="Name"><Input value={editingPersona.name} onChange={v=>setEditingPersona(p=>({...p,name:v}))} placeholder="e.g. The Gift-Giver"/></Field>
            <Field label="Description"><Input value={editingPersona.description||""} onChange={v=>setEditingPersona(p=>({...p,description:v}))} placeholder="Short description"/></Field>
            <Field label="Emoji"><div className="flex flex-wrap gap-1">{EMOJI_OPTIONS.map(e=><button key={e} onClick={()=>setEditingPersona(p=>({...p,emoji:e}))} className={`text-xl p-1.5 rounded-lg ${editingPersona.emoji===e?"bg-indigo-100":"hover:bg-gray-100"}`}>{e}</button>)}</div></Field>
            <Field label="Colour"><div className="flex flex-wrap gap-2">{COLOR_OPTIONS.map(c=><button key={c} onClick={()=>setEditingPersona(p=>({...p,color:c}))} className={`w-8 h-8 rounded-lg border-2 ${editingPersona.color===c?"border-indigo-500":"border-transparent"}`} style={{background:c}}/>)}</div></Field>
            <div className="flex gap-2 pt-1">
              <button onClick={()=>{if(!editingPersona.name.trim())return;if(editingPersona.id)updatePersonas(ps=>ps.map(p=>p.id===editingPersona.id?editingPersona:p));else updatePersonas(ps=>[...ps,{...editingPersona,id:uid()}]);setShowPersonaModal(false);}} className="flex-1 bg-indigo-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Save</button>
              <button onClick={()=>setShowPersonaModal(false)} className="flex-1 border border-gray-200 py-2 rounded-lg text-sm text-gray-500 hover:bg-gray-50">Cancel</button>
            </div>
          </>}
        </Modal>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
